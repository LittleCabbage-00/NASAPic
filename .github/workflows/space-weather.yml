name: Update NOAA space weather

on:
  schedule:
    - cron: '47 12 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasa-apod-readme
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Archive NOAA observations
        run: python3 space_weather.py
      - name: Commit observations
        env:
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          git add -- README.md data/space-weather.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author "$OWNER <$OWNER_ID+$OWNER@users.noreply.github.com>" -m 'Update NOAA space weather observations'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
