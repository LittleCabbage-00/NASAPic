name: Update NASA APOD

on:
  schedule:
    - cron: '37 20 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasa-apod-readme
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Install image dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/nasapic"
          "$RUNNER_TEMP/nasapic/bin/python" -m pip install -r requirements.txt
      - name: Update README gallery
        run: |
          "$RUNNER_TEMP/nasapic/bin/python" apod.py gallery
      - name: Commit the gallery
        env:
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          git add -- README.md
          if [[ -n "$(git ls-files --cached --others --exclude-standard -- assets/apod-week)" ]]; then
            git add -A -- assets/apod-week
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author "$OWNER <$OWNER_ID+$OWNER@users.noreply.github.com>" -m 'Update NASA Astronomy Picture of the Day'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
